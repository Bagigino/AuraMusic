name: Build unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-unsigned:
    name: Build unsigned iOS IPA
    runs-on: macos-26
    timeout-minutes: 120
    env:
      NODE_VERSION: '22.23.1'
      EXPECTED_BUNDLE_IDENTIFIER: com.mariu.auramusic
      CPYTHON_VERSION: '3.14.7'
      CPYTHON_SOURCE_SHA256: 3b48dac8fb59f62eaa67ac83c1eb12bda1b7a08406dd286e252c11a66be27f81
      IOS_DEPLOYMENT_TARGET: '16.4'
      PYTHON_XCFRAMEWORK_PATH: modules/aura-native-test/ios/Python.xcframework
      YT_DLP_VERSION: '2026.07.04'
      YT_DLP_APPLE_PROVIDER_VERSION: '0.1.1'
      CERTIFI_VERSION: '2026.7.22'
      YT_DLP_VENDOR_PATH: modules/aura-native-test/python-vendor
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Python build tooling
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'

      - name: Vendor pinned yt-dlp packages
        shell: bash
        run: |
          if [ -e "$YT_DLP_VENDOR_PATH" ]; then
            echo "::error title=Unsafe vendor path::Expected a fresh yt-dlp vendor directory at $YT_DLP_VENDOR_PATH."
            exit 1
          fi

          mkdir -p "$YT_DLP_VENDOR_PATH"
          if ! python3 -m pip install \
            --disable-pip-version-check \
            --target "$YT_DLP_VENDOR_PATH" \
            --no-compile \
            --no-deps \
            "yt-dlp==$YT_DLP_VERSION"; then
            echo "::error title=yt-dlp vendoring failed::Could not install the pinned yt-dlp package."
            exit 1
          fi

          # Console launchers, shell completions and man pages cannot be used by
          # the embedded interpreter. Keep the Python package and dist-info only.
          rm -rf "$YT_DLP_VENDOR_PATH/bin" "$YT_DLP_VENDOR_PATH/share"
          YT_DLP_ONLY_BYTES=$(du -sk "$YT_DLP_VENDOR_PATH" | awk '{ print $1 * 1024 }')

          if ! python3 -m pip install \
            --disable-pip-version-check \
            --target "$YT_DLP_VENDOR_PATH" \
            --no-compile \
            --no-deps \
            "yt-dlp-apple-webkit-jsi==$YT_DLP_APPLE_PROVIDER_VERSION"; then
            echo "::error title=Apple WebKit provider vendoring failed::Could not install the pinned yt-dlp-apple-webkit-jsi package."
            exit 1
          fi

          rm -rf "$YT_DLP_VENDOR_PATH/bin" "$YT_DLP_VENDOR_PATH/share"
          YT_DLP_AND_PROVIDER_BYTES=$(du -sk "$YT_DLP_VENDOR_PATH" | awk '{ print $1 * 1024 }')

          if ! python3 -m pip install \
            --disable-pip-version-check \
            --target "$YT_DLP_VENDOR_PATH" \
            --no-compile \
            --no-deps \
            "certifi==$CERTIFI_VERSION"; then
            echo "::error title=certifi vendoring failed::Could not install the pinned TLS CA package."
            exit 1
          fi

          rm -rf "$YT_DLP_VENDOR_PATH/bin" "$YT_DLP_VENDOR_PATH/share"

          test -f "$YT_DLP_VENDOR_PATH/certifi/cacert.pem" || {
            echo "::error title=certifi CA bundle missing::certifi/cacert.pem was not vendored."
            exit 1
          }

          test -f "$YT_DLP_VENDOR_PATH/yt_dlp/__init__.py" || {
            echo "::error title=yt-dlp package missing::yt_dlp/__init__.py was not vendored."
            exit 1
          }

          test -f "$YT_DLP_VENDOR_PATH/yt_dlp/version.py" || {
            echo "::error title=yt-dlp version module missing::yt_dlp/version.py was not vendored."
            exit 1
          }

          for provider_file in \
            yt_dlp_plugins/extractor/webkit_jsi.py \
            yt_dlp_plugins/extractor/ytjsc.py \
            yt_dlp_plugins/webkit_jsi/lib/api.py \
            yt_dlp_plugins/webkit_jsi/lib/pyneapple_objc.py; do
            test -f "$YT_DLP_VENDOR_PATH/$provider_file" || {
              echo "::error title=Apple WebKit provider file missing::$provider_file was not vendored."
              exit 1
            }
          done

          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$YT_DLP_VENDOR_PATH" \
            python3 - "$YT_DLP_VERSION" "$YT_DLP_APPLE_PROVIDER_VERSION" "$CERTIFI_VERSION" <<'PYTHON'
          import certifi
          import importlib.metadata
          import importlib.util
          from pathlib import Path
          import sys
          import yt_dlp
          import yt_dlp.extractor
          from yt_dlp.extractor.youtube.jsc._registry import _jsc_providers
          from yt_dlp.globals import all_plugins_loaded
          from yt_dlp.plugins import directories, load_all_plugins
          from yt_dlp.version import __version__

          expected_yt_dlp = sys.argv[1]
          expected_provider = sys.argv[2]
          expected_certifi = sys.argv[3]
          if __version__ != expected_yt_dlp:
              raise SystemExit(
                  f"Vendored yt-dlp version mismatch: expected {expected_yt_dlp}, found {__version__}"
              )

          package_version = importlib.metadata.version('yt-dlp-apple-webkit-jsi')
          if package_version != expected_provider:
              raise SystemExit(
                  f"Apple provider version mismatch: expected {expected_provider}, found {package_version}"
              )

          certifi_version = importlib.metadata.version('certifi')
          if certifi_version != expected_certifi:
              raise SystemExit(
                  f"certifi version mismatch: expected {expected_certifi}, found {certifi_version}"
              )
          if not Path(certifi.where()).is_file():
              raise SystemExit(f'certifi CA bundle is missing: {certifi.where()}')

          namespace_spec = importlib.util.find_spec('yt_dlp_plugins')
          namespace_locations = list(namespace_spec.submodule_search_locations or []) if namespace_spec else []
          if not namespace_locations or not directories():
              raise SystemExit('yt_dlp_plugins is not visible through yt-dlp plugin discovery')

          if not all_plugins_loaded.value:
              load_all_plugins()
          providers = {
              provider.PROVIDER_NAME: provider
              for provider in _jsc_providers.value.values()
          }
          apple_provider = providers.get('apple-webkit-jsi')
          if apple_provider is None:
              raise SystemExit(
                  'apple-webkit-jsi was not registered as a yt-dlp JS Challenge Provider'
              )
          if apple_provider.PROVIDER_VERSION != package_version:
              raise SystemExit(
                  'Registered Apple provider version does not match package metadata: '
                  f'{apple_provider.PROVIDER_VERSION!r} != {package_version!r}'
              )
          if not apple_provider.__module__.startswith('yt_dlp_plugins.'):
              raise SystemExit(
                  f'Apple provider came from unexpected module {apple_provider.__module__!r}'
              )
          print(f"Verified vendored yt-dlp {__version__}")
          print(
              f"Verified registered Apple WebKit provider "
              f"{apple_provider.PROVIDER_NAME}-{apple_provider.PROVIDER_VERSION}"
          )
          PYTHON

          if [ -e "$YT_DLP_VENDOR_PATH/yt_dlp_ejs" ]; then
            echo "::error title=Unexpected optional dependency::yt-dlp-ejs must not be vendored in this proof of concept."
            exit 1
          fi

          VENDOR_BYTES=$(du -sk "$YT_DLP_VENDOR_PATH" | awk '{ print $1 * 1024 }')
          APPLE_PROVIDER_BYTES=$((YT_DLP_AND_PROVIDER_BYTES - YT_DLP_ONLY_BYTES))
          CERTIFI_BYTES=$((VENDOR_BYTES - YT_DLP_AND_PROVIDER_BYTES))
          {
            echo "### Vendored Python packages"
            echo "- yt-dlp version: $YT_DLP_VERSION"
            echo "- Apple WebKit provider version: $YT_DLP_APPLE_PROVIDER_VERSION"
            echo "- certifi version: $CERTIFI_VERSION"
            echo "- Source directory: $YT_DLP_VENDOR_PATH"
            echo "- Uncompressed bytes: $VENDOR_BYTES"
            echo "- Approximate provider addition: $APPLE_PROVIDER_BYTES bytes"
            echo "- Approximate certifi addition: $CERTIFI_BYTES bytes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Initialize build paths
        shell: bash
        run: |
          test -n "$RUNNER_TEMP" || {
            echo "::error title=Missing runner temp::RUNNER_TEMP is not available on this runner."
            exit 1
          }

          echo "DERIVED_DATA_PATH=$RUNNER_TEMP/AuraMusicDerivedData" >> "$GITHUB_ENV"
          echo "PACKAGE_ROOT=$RUNNER_TEMP/AuraMusicUnsigned" >> "$GITHUB_ENV"
          echo "CPYTHON_WORK_DIRECTORY=$RUNNER_TEMP/AuraMusicCPython" >> "$GITHUB_ENV"

      - name: Verify macOS toolchain
        shell: bash
        run: |
          node --version
          npm --version
          pod --version
          xcodebuild -version

          XCODE_VERSION=$(xcodebuild -version | awk 'NR == 1 { print $2 }')
          if ! awk -v version="$XCODE_VERSION" 'BEGIN {
            split(version, parts, ".")
            supported = parts[1] > 26 || (parts[1] == 26 && parts[2] >= 4)
            exit supported ? 0 : 1
          }'; then
            echo "::error title=Unsupported Xcode::Expo SDK 57 requires Xcode 26.4 or newer; found $XCODE_VERSION."
            exit 1
          fi

      - name: Restore embedded CPython framework cache
        id: cpython-cache
        uses: actions/cache@v5
        with:
          path: ${{ env.PYTHON_XCFRAMEWORK_PATH }}
          key: cpython-ios-${{ env.CPYTHON_VERSION }}-arm64-yt-dlp-import-${{ hashFiles('scripts/build-cpython-ios.sh') }}

      - name: Build embedded CPython framework
        if: steps.cpython-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if ! bash scripts/build-cpython-ios.sh \
            "$CPYTHON_WORK_DIRECTORY" \
            "$GITHUB_WORKSPACE/$PYTHON_XCFRAMEWORK_PATH"; then
            echo "::error title=CPython build failed::The official CPython source could not be built for iOS arm64."
            exit 1
          fi

      - name: Verify embedded CPython framework
        shell: bash
        run: |
          PYTHON_FRAMEWORK=$(find "$PYTHON_XCFRAMEWORK_PATH" \
            -mindepth 2 -maxdepth 2 -type d -name 'Python.framework' -print -quit)

          test -n "$PYTHON_FRAMEWORK" || {
            echo "::error title=CPython framework missing::Python.framework was not found in Python.xcframework."
            exit 1
          }

          test -f "$PYTHON_FRAMEWORK/Python" || {
            echo "::error title=CPython binary missing::Python.framework does not contain its executable."
            exit 1
          }

          test -f "$PYTHON_XCFRAMEWORK_PATH/build/utils.sh" || {
            echo "::error title=CPython build helper missing::The official iOS install helper was not found."
            exit 1
          }

          STDLIB_FILE=$(find "$PYTHON_XCFRAMEWORK_PATH" \
            -path '*/lib/python3.14/encodings/__init__.py' -type f -print -quit)
          test -n "$STDLIB_FILE" || {
            echo "::error title=CPython standard library missing::encodings/__init__.py was not found."
            exit 1
          }

          if ! lipo -info "$PYTHON_FRAMEWORK/Python" | grep -Fq 'arm64'; then
            echo "::error title=Invalid CPython architecture::Python.framework does not contain arm64."
            exit 1
          fi


          DYNLIB_DIRECTORY=$(find "$PYTHON_XCFRAMEWORK_PATH" \
            -path '*/lib/python3.14/lib-dynload' -type d -print -quit)
          test -n "$DYNLIB_DIRECTORY" || {
            echo "::error title=CPython extension directory missing::lib-dynload was not found."
            exit 1
          }

          for required_module in _ctypes _socket _ssl select unicodedata zlib; do
            if ! find "$DYNLIB_DIRECTORY" -maxdepth 1 -type f -name "$required_module*.so" -print -quit | grep -q .; then
              echo "::error title=CPython extension missing::$required_module is required to import yt-dlp on iOS."
              exit 1
            fi
          done

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate Expo TypeScript environment
        shell: bash
        run: |
          printf '%s\n' '/// <reference types="expo/types" />' > expo-env.d.ts

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run lint
        run: npm run lint

      - name: Run JavaScript integration tests
        run: npm test

      - name: Verify Expo configuration and local module
        shell: bash
        run: |
          ACTUAL_BUNDLE_IDENTIFIER=$(npx expo config --type public --json | node -e "
            let input = '';
            process.stdin.on('data', chunk => input += chunk);
            process.stdin.on('end', () => {
              const config = JSON.parse(input);
              process.stdout.write(config.ios?.bundleIdentifier ?? '');
            });
          ")

          if [ "$ACTUAL_BUNDLE_IDENTIFIER" != "$EXPECTED_BUNDLE_IDENTIFIER" ]; then
            echo "::error title=Invalid bundle identifier::Expected $EXPECTED_BUNDLE_IDENTIFIER, found $ACTUAL_BUNDLE_IDENTIFIER."
            exit 1
          fi

          AUTOLINKING_JSON="$RUNNER_TEMP/expo-autolinking.json"
          npx expo-modules-autolinking search --platform apple --json > "$AUTOLINKING_JSON"
          node - "$AUTOLINKING_JSON" <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const moduleConfig = config['aura-native-test'];

          if (!moduleConfig?.config?.apple?.modules?.includes('AuraNativeTestModule')) {
            console.error('::error title=Autolinking failed::AuraNativeTestModule was not found by Expo autolinking.');
            process.exit(1);
          }
          NODE

          test -f modules/aura-native-test/ios/AuraPythonBridge.m || {
            echo "::error title=Python bridge missing::AuraPythonBridge.m was not found."
            exit 1
          }

          test -f modules/aura-native-test/python/aura_test.py || {
            echo "::error title=Python test missing::aura_test.py was not found."
            exit 1
          }

          test -f modules/aura-native-test/python/aura_yt_dlp_apple_provider.py || {
            echo "::error title=Apple provider test missing::aura_yt_dlp_apple_provider.py was not found."
            exit 1
          }

          test -f modules/aura-native-test/python/aura_youtube_metadata.py || {
            echo "::error title=YouTube metadata POC missing::aura_youtube_metadata.py was not found."
            exit 1
          }

          grep -Fq 'def download_youtube_m4a_json' \
            modules/aura-native-test/python/aura_youtube_metadata.py || {
            echo "::error title=YouTube M4A POC missing::The embedded Python download entry point was not found."
            exit 1
          }

          grep -Fq 'AsyncFunction("downloadYouTubeM4a")' \
            modules/aura-native-test/ios/AuraNativeTestModule.swift || {
            echo "::error title=YouTube M4A native API missing::downloadYouTubeM4a was not found in AuraNativeTestModule."
            exit 1
          }


          test -f "$YT_DLP_VENDOR_PATH/yt_dlp/version.py" || {
            echo "::error title=Vendored yt-dlp missing::yt_dlp/version.py was not found before Expo Prebuild."
            exit 1
          }

          test -f "$YT_DLP_VENDOR_PATH/yt_dlp_plugins/extractor/ytjsc.py" || {
            echo "::error title=Vendored Apple provider missing::yt_dlp_plugins/extractor/ytjsc.py was not found before Expo Prebuild."
            exit 1
          }

          test -f "$YT_DLP_VENDOR_PATH/certifi/cacert.pem" || {
            echo "::error title=Vendored certifi missing::certifi/cacert.pem was not found before Expo Prebuild."
            exit 1
          }

      - name: Generate iOS project with Expo Prebuild
        shell: bash
        run: |
          if ! npx expo prebuild --platform ios --clean --no-install; then
            echo "::error title=Expo Prebuild failed::The iOS native project could not be generated."
            exit 1
          fi

          test -d ios || {
            echo "::error title=Expo Prebuild failed::The ios directory was not generated."
            exit 1
          }

          if ! grep -R -Fq "Install embedded CPython" ios/*.xcodeproj/project.pbxproj; then
            echo "::error title=CPython config plugin failed::The CPython Xcode build phase was not generated."
            exit 1
          fi

      - name: Install CocoaPods dependencies
        shell: bash
        run: |
          if ! (cd ios && pod install --repo-update); then
            echo "::error title=Pod install failed::CocoaPods could not install the iOS dependencies."
            exit 1
          fi

      - name: Verify AuraNativeTest CocoaPods integration
        shell: bash
        run: |
          test -f modules/aura-native-test/ios/AuraNativeTestModule.swift || {
            echo "::error title=Missing Swift module::AuraNativeTestModule.swift was not found."
            exit 1
          }

          test -f ios/Podfile.lock || {
            echo "::error title=Missing Podfile.lock::CocoaPods did not generate ios/Podfile.lock."
            exit 1
          }

          if ! grep -Fq "AuraNativeTest" ios/Podfile.lock; then
            echo "::error title=Autolinking failed::AuraNativeTest is missing from ios/Podfile.lock."
            exit 1
          fi

          if ! find "ios/Pods/Local Podspecs" -maxdepth 1 -type f -name 'AuraNativeTest.podspec.json' -print -quit | grep -q .; then
            echo "::error title=Local pod missing::AuraNativeTest was not installed as a local CocoaPod."
            exit 1
          fi

          LOCAL_PODSPEC=$(find "ios/Pods/Local Podspecs" -maxdepth 1 -type f -name 'AuraNativeTest.podspec.json' -print -quit)
          if ! grep -Fq "Python.xcframework" "$LOCAL_PODSPEC"; then
            echo "::error title=CPython CocoaPods integration failed::Python.xcframework is missing from the AuraNativeTest podspec."
            exit 1
          fi

      - name: Discover iOS workspace and scheme
        id: ios-project
        shell: bash
        run: |
          WORKSPACE_COUNT=$(find ios -mindepth 1 -maxdepth 1 -type d -name '*.xcworkspace' | wc -l | tr -d '[:space:]')
          if [ "$WORKSPACE_COUNT" -ne 1 ]; then
            echo "::error title=Workspace discovery failed::Expected one top-level application xcworkspace in ios/, found $WORKSPACE_COUNT."
            find ios -mindepth 1 -maxdepth 1 -type d -name '*.xcworkspace' -print
            exit 1
          fi

          WORKSPACE=$(find ios -mindepth 1 -maxdepth 1 -type d -name '*.xcworkspace' -print -quit)
          WORKSPACE_NAME=$(basename "$WORKSPACE" .xcworkspace)
          PREFERRED_SCHEME_FILE=$(find ios -type f -path '*/xcshareddata/xcschemes/*.xcscheme' -not -path '*/Pods/*' -name "$WORKSPACE_NAME.xcscheme" -print -quit)

          if [ -n "$PREFERRED_SCHEME_FILE" ]; then
            SCHEME_FILE="$PREFERRED_SCHEME_FILE"
          else
            SCHEME_COUNT=$(find ios -type f -path '*/xcshareddata/xcschemes/*.xcscheme' -not -path '*/Pods/*' | wc -l | tr -d '[:space:]')
            if [ "$SCHEME_COUNT" -ne 1 ]; then
              echo "::error title=Scheme discovery failed::No unambiguous application scheme was found."
              find ios -type f -path '*/xcshareddata/xcschemes/*.xcscheme' -not -path '*/Pods/*' -print
              exit 1
            fi
            SCHEME_FILE=$(find ios -type f -path '*/xcshareddata/xcschemes/*.xcscheme' -not -path '*/Pods/*' -print -quit)
          fi

          SCHEME=$(basename "$SCHEME_FILE" .xcscheme)
          XCODE_LIST_JSON="$RUNNER_TEMP/xcode-project-list.json"
          xcodebuild -list -json -workspace "$WORKSPACE" > "$XCODE_LIST_JSON"

          node - "$XCODE_LIST_JSON" "$SCHEME" <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const expectedScheme = process.argv[3];
          const schemes = config.workspace?.schemes ?? config.project?.schemes ?? [];

          if (!schemes.includes(expectedScheme)) {
            console.error('::error title=Scheme validation failed::The discovered scheme is not buildable from the workspace.');
            console.error('Discovered: ' + expectedScheme);
            console.error('Available: ' + schemes.join(', '));
            process.exit(1);
          }
          NODE

          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          {
            echo "### iOS project discovered"
            echo "- Workspace: $WORKSPACE"
            echo "- Scheme: $SCHEME"
            echo "- Bundle identifier: $EXPECTED_BUNDLE_IDENTIFIER"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build unsigned Release for iphoneos
        shell: bash
        run: |
          set -o pipefail
          if ! xcodebuild \
            -workspace "${{ steps.ios-project.outputs.workspace }}" \
            -scheme "${{ steps.ios-project.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE= \
            PROVISIONING_PROFILE_SPECIFIER= \
            clean build | tee "$RUNNER_TEMP/xcodebuild.log"; then
            echo "::error title=xcodebuild failed::The unsigned Release build did not complete."
            exit 1
          fi

      - name: Locate app and verify native module in binary
        id: app-bundle
        shell: bash
        run: |
          PRODUCTS_DIR="$DERIVED_DATA_PATH/Build/Products/Release-iphoneos"
          APP_COUNT=$(find "$PRODUCTS_DIR" -maxdepth 1 -type d -name '*.app' | wc -l | tr -d '[:space:]')

          if [ "$APP_COUNT" -ne 1 ]; then
            echo "::error title=App bundle not found::Expected one .app in $PRODUCTS_DIR, found $APP_COUNT."
            find "$PRODUCTS_DIR" -maxdepth 2 -type d -name '*.app' -print || true
            exit 1
          fi

          APP_PATH=$(find "$PRODUCTS_DIR" -maxdepth 1 -type d -name '*.app' -print -quit)
          EXECUTABLE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")
          APP_EXECUTABLE="$APP_PATH/$EXECUTABLE_NAME"

          test -f "$APP_EXECUTABLE" || {
            echo "::error title=App executable missing::Expected $APP_EXECUTABLE."
            exit 1
          }

          strings "$APP_EXECUTABLE" > "$RUNNER_TEMP/auramusic-app-strings.txt"
          if ! grep -Fq "AuraNativeTest" "$RUNNER_TEMP/auramusic-app-strings.txt"; then
            echo "::error title=Native module missing::AuraNativeTest was not found in the compiled app executable."
            exit 1
          fi

          PYTHON_FRAMEWORK="$APP_PATH/Frameworks/Python.framework"
          test -f "$PYTHON_FRAMEWORK/Python" || {
            echo "::error title=Embedded CPython missing::Python.framework was not found in the compiled app."
            exit 1
          }

          test -f "$APP_PATH/python/lib/python3.14/encodings/__init__.py" || {
            echo "::error title=Python standard library missing::The CPython standard library was not found in the app bundle."
            exit 1
          }

          test -f "$APP_PATH/app/aura_test.py" || {
            echo "::error title=Python application code missing::aura_test.py was not found in the app bundle."
            exit 1
          }

          test -f "$APP_PATH/app/aura_yt_dlp_apple_provider.py" || {
            echo "::error title=Apple provider test missing::aura_yt_dlp_apple_provider.py was not found in the app bundle."
            exit 1
          }

          test -f "$APP_PATH/app/aura_youtube_metadata.py" || {
            echo "::error title=YouTube metadata POC missing::aura_youtube_metadata.py was not found in the app bundle."
            exit 1
          }

          grep -Fq 'def download_youtube_m4a_json' \
            "$APP_PATH/app/aura_youtube_metadata.py" || {
            echo "::error title=YouTube M4A POC missing::The Python download entry point is missing from the app bundle."
            exit 1
          }


          test -f "$APP_PATH/python-vendor/yt_dlp/__init__.py" || {
            echo "::error title=Vendored yt-dlp missing::yt_dlp/__init__.py was not found in the app bundle."
            exit 1
          }

          YT_DLP_BUNDLED_VERSION_FILE="$APP_PATH/python-vendor/yt_dlp/version.py"
          test -f "$YT_DLP_BUNDLED_VERSION_FILE" || {
            echo "::error title=yt-dlp version module missing::yt_dlp/version.py was not found in the app bundle."
            exit 1
          }

          if ! grep -Fq "__version__ = '$YT_DLP_VERSION'" "$YT_DLP_BUNDLED_VERSION_FILE"; then
            echo "::error title=yt-dlp bundle version mismatch::The app bundle does not contain yt-dlp $YT_DLP_VERSION."
            exit 1
          fi

          test -f "$APP_PATH/python-vendor/certifi/cacert.pem" || {
            echo "::error title=certifi CA bundle missing::certifi/cacert.pem was not found in the app bundle."
            exit 1
          }

          CERTIFI_METADATA=$(find "$APP_PATH/python-vendor" -maxdepth 1 \
            -type d -name 'certifi-*.dist-info' -print -quit)
          test -n "$CERTIFI_METADATA" || {
            echo "::error title=certifi metadata missing::Package metadata was not found in the app bundle."
            exit 1
          }
          if ! grep -Fxq "Version: $CERTIFI_VERSION" "$CERTIFI_METADATA/METADATA"; then
            echo "::error title=certifi bundle version mismatch::The app bundle does not contain certifi $CERTIFI_VERSION."
            exit 1
          fi

          for provider_file in \
            yt_dlp_plugins/extractor/webkit_jsi.py \
            yt_dlp_plugins/extractor/ytjsc.py \
            yt_dlp_plugins/webkit_jsi/lib/api.py \
            yt_dlp_plugins/webkit_jsi/lib/pyneapple_objc.py; do
            test -f "$APP_PATH/python-vendor/$provider_file" || {
              echo "::error title=Apple WebKit provider missing from app::$provider_file was not found in the app bundle."
              exit 1
            }
          done

          APPLE_PROVIDER_METADATA=$(find "$APP_PATH/python-vendor" -maxdepth 1 \
            -type d -name 'yt_dlp_apple_webkit_jsi-*.dist-info' -print -quit)
          test -n "$APPLE_PROVIDER_METADATA" || {
            echo "::error title=Apple provider metadata missing::Package metadata was not found in the app bundle."
            exit 1
          }
          if ! grep -Fxq "Version: $YT_DLP_APPLE_PROVIDER_VERSION" "$APPLE_PROVIDER_METADATA/METADATA"; then
            echo "::error title=Apple provider bundle version mismatch::The app bundle does not contain yt-dlp-apple-webkit-jsi $YT_DLP_APPLE_PROVIDER_VERSION."
            exit 1
          fi

          if ! grep -Fq "load_framework_from_path('WebKit')" \
            "$APP_PATH/python-vendor/yt_dlp_plugins/webkit_jsi/lib/api.py"; then
            echo "::error title=WebKit loader missing::The bundled provider does not contain its dynamic WebKit loader."
            exit 1
          fi

          for required_module in _ctypes _socket _ssl select unicodedata zlib; do
            test -f "$APP_PATH/Frameworks/$required_module.framework/$required_module" || {
              echo "::error title=CPython runtime extension missing::$required_module.framework was not installed in the app bundle."
              exit 1
            }
          done

          if ! otool -L "$APP_EXECUTABLE" | grep -Fq 'Python.framework/Python'; then
            echo "::error title=CPython not linked::The AuraMusic executable is not linked to Python.framework."
            exit 1
          fi

          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "- App bundle: $APP_PATH" >> "$GITHUB_STEP_SUMMARY"
          echo "- Embedded CPython: $PYTHON_FRAMEWORK" >> "$GITHUB_STEP_SUMMARY"
          echo "- CPython version: $CPYTHON_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- yt-dlp version: $YT_DLP_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- yt-dlp bundle path: $APP_PATH/python-vendor/yt_dlp" >> "$GITHUB_STEP_SUMMARY"
          echo "- Apple WebKit provider version: $YT_DLP_APPLE_PROVIDER_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- Apple WebKit provider path: $APP_PATH/python-vendor/yt_dlp_plugins" >> "$GITHUB_STEP_SUMMARY"
          echo "- WebKit access: dynamic system-framework loading (no link-time dependency)" >> "$GITHUB_STEP_SUMMARY"
          echo "- certifi version: $CERTIFI_VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Package unsigned IPA
        id: package
        shell: bash
        run: |
          APP_PATH="${{ steps.app-bundle.outputs.app_path }}"
          PAYLOAD_DIR="$PACKAGE_ROOT/Payload"
          IPA_PATH="$PACKAGE_ROOT/AuraMusic.ipa"

          if [ -e "$PACKAGE_ROOT" ]; then
            echo "::error title=Unsafe package path::Expected a fresh package directory, but $PACKAGE_ROOT already exists."
            exit 1
          fi

          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"

          (
            cd "$PACKAGE_ROOT"
            COPYFILE_DISABLE=1 /usr/bin/zip -qry "AuraMusic.ipa" "Payload"
          )

          test -s "$IPA_PATH" || {
            echo "::error title=IPA packaging failed::AuraMusic.ipa was not generated."
            exit 1
          }

          /usr/bin/unzip -t "$IPA_PATH"
          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          echo "- Unsigned IPA: $IPA_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: AuraMusic-unsigned-ipa
          path: ${{ steps.package.outputs.ipa_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
